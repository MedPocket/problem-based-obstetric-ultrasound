[build]
command = "bun run build"
publish = "dist"

[build.environment]
NODE_OPTIONS = "--max-old-space-size=4096"

[[headers]]
for = "/_astro/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.html"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
from = "/*"
to = "/404.html"
status = 404
